<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Action Item Extractor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      margin: 2rem auto;
      max-width: 800px;
      padding: 0 1rem;
    }

    h1 {
      font-size: 1.5rem;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
    }

    button {
      padding: 0.5rem 1rem;
    }

    .items {
      margin-top: 1rem;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0;
    }

    .muted {
      color: #6b7280;
      font-size: 0.875rem;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .notes {
      margin-top: 1rem;
    }

    .note {
      border: 1px solid #e5e7eb;
      border-radius: 0.375rem;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .note-id {
      font-weight: 600;
      color: #374151;
    }

    .note-time {
      font-size: 0.75rem;
      color: #6b7280;
    }

    .note-content {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
    }
  </style>
</head>

<body>
  <h1>Action Item Extractor</h1>
  <p class="muted">Paste notes and extract actionable items. Minimal raw HTML frontend.</p>

  <label for="text">Notes</label>
  <textarea id="text"
    placeholder="Paste notes here...&#10;e.g.&#10;- [ ] Set up database&#10;- Implement extract endpoint"></textarea>
  <div class="row">
    <label class="row"><input id="save_note" type="checkbox" checked /> Save as note</label>
    <button id="extract">Extract (规则)</button>
    <button id="extract_llm">Extract (LLM)</button>
    <button id="list_notes">列出笔记</button>
  </div>

  <div class="items" id="items"></div>
  <div class="notes" id="notes"></div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const itemsEl = $('#items');

    // 通用提取函数
    async function performExtraction(endpoint, methodName) {
      const text = $('#text').value;
      const save = $('#save_note').checked;
      itemsEl.textContent = `Extracting with ${methodName}...`;
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, save_note: save }),
        });
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        if (!data.action_items || data.action_items.length === 0) {
          itemsEl.innerHTML = '<p class="muted">No action items found.</p>';
          return;
        }
        itemsEl.innerHTML = data.action_items.map(it => (
          `<div class="item"><input type="checkbox" data-id="${it.id}" /> <span>${it.description}</span></div>`
        )).join('');
        itemsEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', async (e) => {
            const id = e.target.getAttribute('data-id');
            await fetch(`/action-items/${id}/done`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ done: e.target.checked }),
            });
          });
        });
      } catch (err) {
        console.error(err);
        itemsEl.textContent = 'Error extracting items';
      }
    }

    // 规则提取按钮
    $('#extract').addEventListener('click', () => {
      performExtraction('/action-items/extract', '规则方法');
    });

    // LLM提取按钮
    $('#extract_llm').addEventListener('click', () => {
      performExtraction('/action-items/extract-llm', 'LLM方法');
    });

    // 列出笔记按钮
    $('#list_notes').addEventListener('click', async () => {
      const notesEl = $('#notes');
      notesEl.textContent = 'Loading notes...';
      try {
        const res = await fetch('/notes', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        if (!res.ok) throw new Error('Request failed');
        const notes = await res.json();
        
        if (!notes || notes.length === 0) {
          notesEl.innerHTML = '<p class="muted">No notes found.</p>';
          return;
        }
        
        notesEl.innerHTML = notes.map(note => (
          `<div class="note">
            <div class="note-header">
              <span class="note-id">Note #${note.id}</span>
              <span class="note-time">${new Date(note.created_at).toLocaleString()}</span>
            </div>
            <div class="note-content">${note.content}</div>
          </div>`
        )).join('');
        
      } catch (err) {
        console.error(err);
        notesEl.textContent = 'Error loading notes';
      }
    });

  </script>
</body>

</html>
